name: CI (i18n)

on:
  push:
    branches: ["feat/i18n"]
  pull_request:
    branches: ["feat/i18n"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "clipboard"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build (features: ${{ matrix.features || 'default' }})
        run: cargo build --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  test-i18n:
    name: Verify i18n locale integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check all locale keys exist in both languages
        run: |
          # Verify that the zh.rs file compiles and maps all translation keys
          cargo check 2>&1
      - name: Build with Chinese locale test
        run: |
          # Smoke test: verify app starts with locale loading
          cargo build --verbose
      - name: Test language fallback behavior
        run: |
          # Ensure binary starts without crash (headless test)
          cargo run -- --help > /dev/null 2>&1 && echo "CLI works with i18n"

  build-all-targets:
    name: Cross-platform build check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
